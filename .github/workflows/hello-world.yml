name: Custom Workflow

on:
  push:
    branches:
      - develop

jobs:
  custom-job:
    runs-on: ubuntu-latest

    steps:
      # Checkout repository code
      - name: Checkout code
        uses: actions/checkout@v3

      # List project files
      - name: List files
        run: ls -la

      # Print success message
      - name: Print success message
        run: echo "Custom workflow completed successfully"
