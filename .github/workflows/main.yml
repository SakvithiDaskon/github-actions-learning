name: Custom Workflow

on:
  push:
    branches:
      - develop

jobs:
  custom-job:
    runs-on: ubuntu-latest

    steps:
      # Download repository code
      - name: Checkout code
        uses: actions/checkout@v3

      # Show files in the repository
      - name: List files
        run: ls -la

      # Print success message
      - name: Success message
        run: echo "Custom workflow completed successfully"
